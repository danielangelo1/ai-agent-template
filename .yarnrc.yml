# Yarn Berry defaults to PnP (no node_modules/ at all), which breaks
# scripts/verify.sh's node_modules/.bin/<tool> calls and every other tool
# in this stack that assumes a traditional layout. Force the classic
# linker so `yarn install` produces the same node_modules/.bin shape as
# npm and pnpm (ADR-005 — real npm/yarn compatibility, not just
# "yarn install exits 0").
nodeLinker: node-modules
